<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="40" y="40" font-family="Helvetica, Arial, sans-serif" font-size="24">Right-Bay Packaging</text>
  <rect x="140" y="120" width="410" height="380" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="220" y="150" width="150" height="150" fill="#f6f0ff" stroke="#6f4ea5" stroke-width="2"/>
  <rect x="180" y="335" width="260" height="140" fill="#efe3ff" stroke="#6f4ea5" stroke-width="2" fill-opacity="0.6"/>
  <rect x="120" y="170" width="20" height="280" fill="#dddddd" stroke="#555" stroke-width="2"/>
  <text x="232" y="225" font-family="Helvetica, Arial, sans-serif" font-size="16">Low-Pro bucket</text>
  <text x="220" y="410" font-family="Helvetica, Arial, sans-serif" font-size="16">Hercules on low deck</text>
  <text x="590" y="170" font-family="Helvetica, Arial, sans-serif" font-size="18">Service sequence</text>
  <text x="590" y="210" font-family="Helvetica, Arial, sans-serif" font-size="16">1. Remove service face</text>
  <text x="590" y="240" font-family="Helvetica, Arial, sans-serif" font-size="16">2. Remove bucket</text>
  <text x="590" y="270" font-family="Helvetica, Arial, sans-serif" font-size="16">3. Disconnect short hose if needed</text>
  <text x="590" y="300" font-family="Helvetica, Arial, sans-serif" font-size="16">4. Slide or lift extractor forward</text>
</svg>
