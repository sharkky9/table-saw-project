<svg xmlns="http://www.w3.org/2000/svg" width="800" height="584" viewBox="0 0 800 584"><rect x="40.0" y="40.0" width="720.0" height="384.0" fill="#fbfaf7" fill-opacity="1.0" stroke="#111" stroke-width="1.5" /><text x="40.0" y="24.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#111">Deployed Mode</text><line x1="8.0" y1="32.0" x2="792.0" y2="32.0" stroke="#666" stroke-width="3" /><text x="40.0" y="14.4" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#555">wall / parked reference line</text><rect x="40.0" y="170.0" width="720.0" height="254.0" fill="#efe8d8" fill-opacity="0.45" stroke="#7e6f5b" stroke-width="1.5" /><rect x="518.0" y="40.0" width="242.0" height="130.0" fill="#efe8d8" fill-opacity="0.45" stroke="#7e6f5b" stroke-width="1.5" /><rect x="40.0" y="40.0" width="478.0" height="130.0" fill="#cfe9c7" fill-opacity="0.6" stroke="#4b7d3a" stroke-width="1.5" /><text x="48.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#2b5d1f">wing down</text><rect x="600.0" y="104.0" width="148.0" height="256.0" fill="#d4dcff" fill-opacity="0.55" stroke="#3047aa" stroke-width="1.5" /><text x="600.0" y="88.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#223177">tool / router end</text><text x="56.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#111">Bench rolls straight out from the wall; no rotation required for the default workflow.</text><text x="56.0" y="480.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#111">The front wing only spans the left and center modules. The front-right corner stays fixed for router and service access.</text></svg>