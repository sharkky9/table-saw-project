<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720">
  <rect width="1040" height="720" fill="#ffffff"/>
  <text x="40" y="42" font-family="Helvetica, Arial, sans-serif" font-size="24">Flip-Top Detail</text>
  <rect x="40" y="60" width="960" height="56" fill="#eef6ff" stroke="#3047aa" stroke-width="2"/>
  <text x="56" y="84" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#3047aa">Public DCS781 dimensions are accepted by default.</text>
  <text x="56" y="106" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3047aa">Real tray fit, shim tuning, and final bolt transfer still remain manual before hard-stop and latch tuning are called done.</text>

  <rect x="120" y="150" width="460" height="24" fill="#dad0be" stroke="#111" stroke-width="2"/>
  <rect x="290" y="174" width="220" height="24" fill="#fff4c8" stroke="#b48300" stroke-width="2"/>
  <rect x="250" y="230" width="220" height="42" fill="#efe8d8" stroke="#7e6f5b" stroke-width="2"/>
  <rect x="230" y="230" width="20" height="120" fill="#d2c09b" stroke="#333" stroke-width="2"/>
  <rect x="470" y="230" width="20" height="120" fill="#d2c09b" stroke="#333" stroke-width="2"/>
  <circle cx="490" cy="186" r="10" fill="#444"/>
  <line x1="490" y1="186" x2="710" y2="286" stroke="#444" stroke-width="3"/>
  <rect x="708" y="278" width="140" height="18" fill="#efe8d8" stroke="#7e6f5b" stroke-width="2"/>
  <rect x="690" y="330" width="40" height="28" fill="#d2c09b" stroke="#333" stroke-width="2"/>
  <rect x="520" y="150" width="30" height="40" fill="#d4dcff" stroke="#3047aa" stroke-width="2"/>
  <rect x="675" y="295" width="36" height="36" fill="#d4dcff" stroke="#3047aa" stroke-width="2"/>

  <text x="560" y="168" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#3047aa">FT-02 latch block</text>
  <text x="735" y="324" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#3047aa">FT-03 hard stop</text>
  <text x="250" y="290" font-family="Helvetica, Arial, sans-serif" font-size="16">MS-01 tray deck plus MS-02 / MS-03 tray frame</text>
  <text x="305" y="165" font-family="Helvetica, Arial, sans-serif" font-size="16">MS-04 stowed cover</text>
  <text x="520" y="205" font-family="Helvetica, Arial, sans-serif" font-size="16">FAST-11 / FAST-12 pivot</text>
  <text x="120" y="430" font-family="Helvetica, Arial, sans-serif" font-size="16">Rear-edge pivot is motion only.</text>
  <text x="120" y="458" font-family="Helvetica, Arial, sans-serif" font-size="16">Deployed height comes from hard stops, not latch slop.</text>
  <text x="120" y="486" font-family="Helvetica, Arial, sans-serif" font-size="16">Stowed flushness comes from the latch and tuned contact points.</text>
  <text x="120" y="514" font-family="Helvetica, Arial, sans-serif" font-size="16">Cycle the mechanism before calling the station precision-ready.</text>
</svg>
